extends: mcp.tool::au-mcp-sdk
fields:
  #: absolute path whose typed highlight-token stream to return (null for a non-held file).
  path: String
meta:
  - type: plugin-runtime-meta::au-mcp-sdk
    entry: ./src/tool-au-semantic-tokens.ts
    contractVersion: 0
  - type: tool-access-meta::au-mcp-sdk
    broker: read
  - type: tool-presentation-meta::au-mcp-sdk
    description: "Engine: a file's typed, reference-aware highlight tokens (what a generic grammar can't produce) — an ordered stream of { range, kind, ... }: wikilink-resolved/broken, field-value, type-claim, typed-block, block-id, anchor (and type-def shape kinds for a *.type.yaml). null for a non-held file. Mostly an editor-rendering surface; for navigation prefer au_references / au_follow."
